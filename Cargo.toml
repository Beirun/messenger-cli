[package]
name = "messenger-cli"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Unofficial command-line client and library for a personal Facebook Messenger account"
repository = "https://github.com/Beirun/messenger-cli"

[[bin]]
name = "messenger"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3.34"
messenger-client = { git = "https://github.com/rgryta/messenger-sync", rev = "4dc955ee8e2a809b13069f43e9a4f345a495f00b", version = "0.2.9" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
